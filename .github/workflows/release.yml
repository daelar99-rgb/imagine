# 이매진 릴리즈 자동화 v1.0.0
# 깃허브 레포에 .github/workflows/release.yml 로 넣는다.
# main 의 이매진.js 가 바뀌면 //@version 을 읽어 릴리즈 vX.Y.Z 를 만들고 imagine.js 로 첨부한다.
# 같은 판 릴리즈가 이미 있으면 imagine.js 만 바꿔 올린다 (같은 판 수정).
# Actions 탭의 Run workflow 로 손으로 돌릴 수도 있다.

name: release

on:
  push:
    branches: [main]
    paths: ['이매진.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(grep -m1 '^//@version ' 이매진.js | awk '{print $2}' | tr -d '\r')
          if [ -z "$v" ]; then echo "이매진.js 에 //@version 줄이 없습니다" >&2; exit 1; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.v }}
        run: |
          cp 이매진.js imagine.js
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" imagine.js --clobber
          else
            if [ -f README.md ]; then
              # README 첫 줄의 판 번호를 이번 판으로 맞춰 본문으로 쓴다
              sed -E "1s/v[0-9]+\.[0-9]+\.[0-9]+/v$V/" README.md > notes.md
            else
              echo "이매진 v$V" > notes.md
            fi
            gh release create "v$V" imagine.js \
              --title "이매진 v$V (RISU Plugin)" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
